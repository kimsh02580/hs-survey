<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>고교-대학 연계 활동 설문(고교·교육청용)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1b2331; --ink2:#48536a; --muted:#7b8598;
  --line:#dfe3ea; --line2:#edf0f4; --brand:#1c4a75; --brand-ink:#143758; --brand-soft:#e7eff7;
  --ok:#0e7a68; --ok-soft:#dcf0eb; --warn:#9a5a00; --warn-soft:#fff3e0; --err:#bf3a2b; --err-soft:#fdecea;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* 위 막대 */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topbar .row{display:flex;align-items:center;gap:12px;height:56px}
.topbar .t{font-weight:700;font-size:15px;color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);white-space:nowrap}
.bar{width:130px;height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.saved{font-size:12px;color:var(--muted);min-width:76px;text-align:right}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;font-size:13px;padding:4px 11px;border-radius:99px;background:var(--line2);color:var(--ink2);text-decoration:none}
.nav a.done{background:var(--ok-soft);color:var(--ok)}
.nav a.cur{background:var(--brand);color:#fff}
@media (max-width:640px){.bar{width:64px}.saved{display:none}.topbar .t{font-size:14px}}

.testbar{background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:700;text-align:center;padding:7px 12px}

/* 첫 화면 */
.hero{background:var(--brand);color:#fff;padding:40px 0 38px}
.hero .kicker{font-size:14px;opacity:.85}
.hero h1{font-size:27px;line-height:1.35;margin:8px 0 18px;font-weight:800}
.hero p{margin:0 0 10px;opacity:.96;max-width:760px}
.hero .sign{margin-top:16px;font-size:14px;opacity:.88}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.meta span{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;font-size:13px}
.start-row{margin-top:26px}
@media (max-width:640px){.hero h1{font-size:22px}}
body.intro .topbar{display:none}
body:not(.intro) .hero{display:none}

/* 화면 */
.page{display:none}.page.on{display:block}
.part-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 6px}
.part-h .num{font-weight:800;color:var(--brand);font-size:22px}
.part-h h2{margin:0;font-size:22px;font-weight:800;line-height:1.35}
.part-h.more{margin-top:34px}
.lead{color:var(--ink2);margin:0 0 14px}
.lead ul{margin:6px 0 0;padding-left:20px}
.lead b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 14px}
@media (max-width:640px){.card{padding:16px}}
.q{padding:16px 0;border-top:1px solid var(--line2)}
.card>.q:first-child{border-top:0;padding-top:2px}
.card>.q:last-child{padding-bottom:2px}
.q-h{font-weight:700;font-size:16.5px;margin:0 0 8px;line-height:1.5}
.qn{color:var(--brand);margin-right:7px}
.q-sub{color:var(--ink2);font-size:14.5px;margin:-2px 0 10px}
.req{color:var(--err);font-weight:700;margin-left:3px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:0 7px;margin-right:6px;background:var(--brand-soft);color:var(--brand);vertical-align:1px}
.rmsg{display:none;color:var(--err);font-size:13px;margin-top:6px}
.missing>.rmsg,.missing .rmsg.in{display:block}

/* 보기(단일·복수) */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.stack{flex-direction:column;align-items:stretch}
.opts label{cursor:pointer;position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:flex;align-items:flex-start;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:8px 13px;background:#fff;font-size:15px;line-height:1.5;transition:background .12s,border-color .12s}
.opts span i{font-style:normal;color:var(--brand);flex:none}
.opts label:hover span{border-color:#9db2cb}
.opts input:focus-visible+span{outline:3px solid #9cc3ea;outline-offset:1px}
.opts input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.opts input:checked+span i{color:#cfe0f1}
.missing .opts span,.missing .rating span{border-color:var(--err)}
.other-in{margin-top:8px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;display:none}
.other-in.on{display:block}
.maxmsg{display:none;font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin-top:8px}
.maxmsg.on{display:block}

/* 활동 카드(Ⅱ, Ⅴ) */
.item{padding:18px 0;border-top:1px solid var(--line2)}
.card>.item:first-child{border-top:0;padding-top:2px}
.card>.item:last-child{padding-bottom:2px}
.item-h{font-weight:800;font-size:16.5px;margin:0 0 4px}
.item-h .no{color:var(--brand);margin-right:8px}
.item-d{color:var(--ink2);font-size:14.5px;margin:0 0 12px}
.sub{margin:0 0 12px}
.sub:last-child{margin-bottom:0}
.rlabel{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 6px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer;color:var(--ink2)}
.chk input{width:18px;height:18px;accent-color:var(--brand)}

/* 5점 척도 */
.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:520px}
.rating.dk{grid-template-columns:repeat(5,1fr) 1.15fr;max-width:630px}
.rating label{position:relative;cursor:pointer}
.rating input{position:absolute;opacity:0;pointer-events:none}
.rating span{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:10px;padding:7px 2px;background:#fff;min-height:54px;transition:background .12s,border-color .12s}
.rating span b{font-size:17px;line-height:1.2}
.rating span small{font-size:11px;color:var(--muted);line-height:1.25;text-align:center;margin-top:2px}
.rating label:hover span{border-color:#9db2cb}
.rating input:focus-visible+span{outline:3px solid #9cc3ea;outline-offset:1px}
.rating input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.rating input:checked+span small{color:#dbe7f3}

textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;line-height:1.6}
textarea{min-height:92px;resize:vertical}
textarea.sm{min-height:58px}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #d6e4f2}
.fgrid{display:grid;gap:10px}
.fgrid label{display:block;font-size:14px;font-weight:700;color:var(--ink2)}
.fgrid label textarea{margin-top:4px;font-weight:400}
.prop-h{font-weight:800;margin:18px 0 8px;color:var(--brand-ink)}
.prop-h:first-of-type{margin-top:6px}
.opt{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:6px}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ranks label{font-size:14px;font-weight:700;color:var(--ink2)}
select{width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-weight:400}
details.ref{border:1px solid var(--line);border-radius:12px;background:#fafbfc;margin:0 0 12px}
details.ref>summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--brand-ink);font-size:14.5px}
details.ref ol{margin:0;padding:0 16px 12px 16px;list-style:none;font-size:14px;color:var(--ink2)}
details.ref li{padding:3px 0}
details.ref li b{color:var(--brand);margin-right:6px}
.callout{background:var(--brand-soft);border-left:4px solid var(--brand);color:var(--brand-ink);border-radius:8px;padding:10px 12px;font-size:14.5px;margin:0 0 12px}

/* 이동·제출 */
.pager{display:flex;justify-content:space-between;gap:10px;margin:10px 0 14px}
.pager .sp{flex:1}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px 30px;font-size:16.5px;font-weight:700;cursor:pointer;min-width:120px}
.btn:hover{background:var(--brand-ink)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.start{background:#fff;color:var(--brand);font-size:18px;padding:15px 40px}
.btn.start:hover{background:#eef4fa}
.pmsg{display:none;color:var(--err);font-size:14px;text-align:right;margin:0 0 20px}
.pmsg.on{display:block}
.errbox{display:none;margin:0 0 16px;background:var(--err-soft);color:var(--err);border-radius:10px;padding:12px 14px;font-size:14px}
.errbox.on{display:block}
.errbox a{color:var(--err);font-weight:700}
.screen{display:none;max-width:640px;margin:64px auto;text-align:center;padding:0 16px}
.screen .ok{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px}
.screen .again{margin-top:28px;font-size:13.5px;color:var(--muted)}
.screen .again a{color:var(--brand)}
.hint{font-size:13px;color:var(--muted)}
.topics{margin:6px 0 0;padding-left:20px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px 0 48px}
</style>
</head>
<body class="intro">

<div id="app">
  <div class="testbar" id="testbar" hidden>시험용 화면입니다. 구글에 올리기 전이라 응답이 저장되지 않습니다.</div>
  <div class="topbar">
    <div class="wrap row">
      <div class="t" id="topTitle"></div>
      <div class="prog"><span id="progTxt">0%</span><div class="bar"><i id="progBar"></i></div></div>
      <div class="saved" id="savedTxt"></div>
    </div>
    <div class="wrap"><nav class="nav" id="nav"></nav></div>
  </div>
  <header class="hero"><div class="wrap" id="hero"></div></header>
  <main class="wrap" id="form"></main>
  <footer id="foot"></footer>
</div>

<div class="screen" id="done">
  <div class="ok">✓</div>
  <h2>응답이 제출되었습니다</h2>
  <p>조사에 참여해 주셔서 감사합니다.<br>보내 주신 의견은 고교-대학 연계 활동의 방향을 정리하는 데 쓰겠습니다.</p>
  <p class="hint" id="doneId"></p>
  <p class="again">같은 기기에서 다른 분이 응답하시려면 <a href="#" id="againBtn">새 응답 시작</a>을 눌러 주십시오.</p>
</div>
<div class="screen" id="closed">
  <h2>조사가 마감되었습니다</h2>
  <p>관심을 가져 주셔서 감사합니다.</p>
</div>

function addField(o){

function rChoice(b){
  const required = b.required !== false;
  const name = addField({col:b.col, kind:'radio', required, key:b.key});
  let other = '';
  if (b.other){
    const on = addField({col:b.col + ' 기타', kind:'other', of:name, val:String(b.other), host:name});
    other = `<input type="text" class="other-in" name="${on}" data-other-of="${name}" data-other-val="${b.other}" placeholder="기타 내용을 적어 주십시오" maxlength="200">`;

  return `<div class="q" data-host="${name}"${condAttr(b)}>

  b.items.forEach(it => {
    h += `<div class="item"><div class="item-h"><span class="no">${esc(it.no)}</span>${esc(it.name)}</div><div class="item-d">${esc(it.desc)}</div>`;
    b.cols.forEach(c => {
      const name = addField({col:`${it.no} ${c.short}`, kind:'radio', required:true});
      h += `<div class="sub" data-host="${name}"><div class="rlabel">${esc(c.label)}${REQ}</div>
        <div class="opts">${c.opts.map((o,i) => `<label><input type="radio" name="${name}" value="${i+1}"><span><i>${CIRC(i)}</i>${esc(o)}</span></label>`).join('')}</div>
        <div class="rmsg">보기 하나를 골라 주십시오.</div></div>`;
    });
    const cn = addField({col:`${it.no} ${b.check.short}`, kind:'check', required:false});
    h += `<label class="chk"><input type="checkbox" name="${cn}" value="1">${esc(b.check.label)}</label></div>`;
  });
  return h;
}

/* Ⅴ: 활동마다 중요도와 현재 수준 */
function rBorich(b){
  let h = '';
  b.items.forEach(it => {
    h += `<div class="item"><div class="item-h"><span class="no">${esc(it.no)}</span>${esc(it.name)}</div><div class="item-d">${esc(it.desc)}</div>`;
    const a = addField({col:`${it.no} 중요도`, kind:'radio', required:true});
    h += `<div class="sub" data-host="${a}"><div class="rlabel">중요도${REQ}</div>${ratingHtml(a, b.labels, false)}<div class="rmsg">중요도를 골라 주십시오.</div></div>`;
    const c = addField({col:`${it.no} 현재 수준`, kind:'radio', required:true});
    h += `<div class="sub" data-host="${c}"><div class="rlabel">현재 수준${REQ}</div>${ratingHtml(c, b.labels, true)}<div class="rmsg">현재 수준을 골라 주십시오. 잘 모르시면 '모름'을 골라 주십시오.</div></div></div>`;
  });
  return h;
}

function rRank(b){
  let h = `<div class="q"><div class="q-h"><span class="qn">${esc(b.key)}</span>${esc(b.q)}<span class="opt">선택</span></div><div class="ranks" data-rank="1">`;
  for (let k = 1; k <= b.n; k++){
    const name = addField({col:`${b.key} ${k}순위`, kind:'select', required:false});
    h += `<label>${k}순위<select name="${name}"><option value="">선택 안 함</option>${b.items.map(it => `<option value="${esc(it.no)}">${esc(it.no)} ${esc(it.name)}</option>`).join('')}</select></label>`;
  }
  return h + '</div><div class="rmsg in" data-rankmsg="1" style="display:none">같은 활동을 두 번 고를 수 없습니다.</div></div>';
}

function rRef(b){
  return `<details class="ref"><summary>${esc(b.title)}</summary><ol>${b.items.map(it => `<li><b>${esc(it.no)}</b>${esc(it.name)}</li>`).join('')}</ol></details>`;
}

const RENDER = {choice:rChoice, multi:rMulti, text:rText, proposal:rProposal, acts:rActs, borich:rBorich, rank:rRank, ref:rRef,
  callout: b => `<div class="callout">${esc(b.text)}</div>`};

/* ---------------- 화면 만들기 ---------------- */
function build(){
  document.title = SPEC.title;
  $('#topTitle').textContent = SPEC.title;
  $('#foot').textContent = SPEC.sign;
  const contact = '문의: 연구보조원 김영우(한국외국어대학교)' + (CFG.CONTACT ? ' ' + CFG.CONTACT : '');
  $('#hero').innerHTML = `<div class="kicker">${esc(SPEC.kicker)}</div><h1>${SPEC.h1.map(esc).join('<br>')}</h1>`
    + SPEC.intro.map(p => `<p>${esc(p)}</p>`).join('')
    + `<p>${esc(contact)}</p><div class="sign">${esc(SPEC.sign)}</div>`
    + `<div class="meta">${SPEC.meta.concat(CFG.DEADLINE ? ['응답 기한: ' + CFG.DEADLINE] : []).map(m => `<span>${esc(m)}</span>`).join('')}</div>`
    + `<div class="start-row"><button class="btn start" id="startBtn" type="button">응답 시작하기 →</button></div>`;

  let html = '', nav = '';
  SPEC.pages.forEach((pg, pi) => {
    const step = pi + 1, last = step === SPEC.pages.length;
    nav += `<a href="#" data-step="${step}">${esc(pg.nav)}</a>`;
    html += `<section class="page" data-step="${step}">`;
    pg.parts.forEach((pt, k) => {
      html += `<div class="part-h${k ? ' more' : ''}"><span class="num">${esc(pt.num)}</span><h2>${esc(pt.title)}</h2></div>`;
      if (pt.lead) html += `<div class="lead">${pt.lead.map(l => Array.isArray(l) ? '<ul>' + l.map(x => `<li><b>${esc(x[0])}</b> ${esc(x[1])}</li>`).join('') + '</ul>' : `<div>${esc(l)}</div>`).join('')}</div>`;
      pt.cards.forEach(card => { html += '<div class="card">' + card.map(b => RENDER[b.type](b)).join('') + '</div>'; });
    });
    if (last) html += '<div class="errbox" id="errBox"></div>';
    html += `<div class="pager">${step > 1 ? `<button class="btn ghost" type="button" data-go="${step-1}">← 이전</button>` : ''}<span class="sp"></span>`
      + (last ? '<button class="btn" type="button" id="submitBtn">응답 제출하기</button>' : `<button class="btn" type="button" data-go="${step+1}">다음 →</button>`)
      + '</div><div class="pmsg"></div></section>';
  });
  $('#form').innerHTML = html; $('#nav').innerHTML = nav;
  if (!CFG.GAS && !CFG.SCRIPT_URL) $('#testbar').hidden = false;
}

/* ---------------- 값 읽기 ---------------- */
const hostEl = f => document.querySelector(`[data-host="${f.host}"]`) || document.querySelector(`[name="${f.name}"]`);
const isShown = f => { const h = hostEl(f); return !(h && h.closest('[hidden]')); };
function rawVal(f){
  if (f.kind === 'radio'){ const e = document.querySelector(`input[name="${f.name}"]:checked`); if (!e) return ''; return /^\d+$/.test(e.value) ? +e.value : e.value; }
  if (f.kind === 'multi') return $$(`input[name="${f.name}"]:checked`).map(e => e.value).join(';');
  if (f.kind === 'check') return document.querySelector(`input[name="${f.name}"]`).checked ? 1 : 0;
  const e = document.querySelector(`[name="${f.name}"]`); const v = e ? e.value.trim() : '';
  if (f.kind === 'other') return otherOn(f) ? v : '';
  return v;
}
const otherOn = f => !!document.querySelector(`input[name="${f.of}"][value="${f.val}"]:checked`);
const val = f => isShown(f) ? rawVal(f) : '';
const answered = f => { const v = val(f); return v !== '' && v != null; };

/* ---------------- 표시 조건·보기 제약 ---------------- */
function applyConds(){
  $$('[data-cond]').forEach(el => {
    const c = JSON.parse(el.dataset.cond); const src = FIELDS.find(f => f.name === KEY2NAME[c.key]);
    const v = src ? rawVal(src) : '';
    el.hidden = c.in ? !c.in.includes(v) : (c.notIn ? c.notIn.includes(v) : false);
  });
}
function onMultiChange(input){
  const box = input.closest('.opts'); if (!box || !box.dataset.excl) return;
  const excl = JSON.parse(box.dataset.excl), max = +box.dataset.max || 0;
  const all = Array.from(box.querySelectorAll('input[type=checkbox]'));
  const msg = box.parentElement.querySelector('.maxmsg'); if (msg) msg.classList.remove('on');
  if (input.checked){
    if (excl.includes(input.value)) all.forEach(x => { if (x !== input) x.checked = false; });
    else all.forEach(x => { if (excl.includes(x.value)) x.checked = false; });
    if (max && all.filter(x => x.checked).length > max){ input.checked = false; if (msg) msg.classList.add('on'); }
  }
}
function rankDup(){
  let dup = false;
  $$('[data-rank]').forEach(box => {
    const vals = Array.from(box.querySelectorAll('select')).map(s => s.value).filter(Boolean);
    const d = new Set(vals).size !== vals.length; if (d) dup = true;
    const m = box.parentElement.querySelector('[data-rankmsg]'); if (m) m.style.display = d ? 'block' : 'none';
  });
  return dup;
}

/* ---------------- 임시저장 ---------------- */
let saveTimer, startedAt = Date.now(), submitted = false;
function saveDraft(){
  clearTimeout(saveTimer);
  if (submitted) return;
  saveTimer = setTimeout(() => {
    try {
      const d = {startedAt, v:{}};
      $$('#form input, #form textarea, #form select').forEach(el => {
        if (!el.name) return;
        if (el.type === 'radio'){ if (el.checked) d.v[el.name] = el.value; }
        else if (el.type === 'checkbox'){ if (el.checked) (d.v[el.name] = d.v[el.name] || []).push(el.value); }
        else if (el.value) d.v[el.name] = el.value;
      });
      localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
      const t = new Date(); $('#savedTxt').textContent = `임시저장 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    } catch(e){}
  }, 400);
}
function loadDraft(){
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (!d) return;
    if (d.startedAt) startedAt = d.startedAt;
    Object.entries(d.v || {}).forEach(([name, v]) => {
      $$(`[name="${name}"]`).forEach(el => {
        if (el.type === 'radio') el.checked = el.value === v;
        else if (el.type === 'checkbox') el.checked = Array.isArray(v) && v.includes(el.value);
        else el.value = v;
      });
    });
    $('#savedTxt').textContent = '임시저장 불러옴';
  } catch(e){}
}

/* ---------------- 진행률 ---------------- */
function pageOf(f){ const h = hostEl(f); const pg = h && h.closest('.page'); return pg ? +pg.dataset.step : 0; }
function refreshUI(){
  applyConds();
  $$('.other-in').forEach(o => o.classList.toggle('on', !!document.querySelector(`input[name="${o.dataset.otherOf}"][value="${o.dataset.otherVal}"]:checked`)));
  let total = 0, done = 0; const per = {};
  FIELDS.forEach(f => {
    if (!f.required || !isShown(f)) return;
    const ok = answered(f), s = pageOf(f);
    total++; if (ok) done++;
    per[s] = per[s] || [0,0]; per[s][1]++; if (ok) per[s][0]++;
    if (ok){ const h = hostEl(f); if (h) h.classList.remove('missing'); }
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  $('#progTxt').textContent = pct + '%'; $('#progBar').style.width = pct + '%';
  $$('#nav a').forEach(a => { const s = per[+a.dataset.step]; a.classList.toggle('done', !!s && s[0] === s[1]); });
  rankDup();
}

/* ---------------- 화면 이동 ---------------- */
let step = 0;
function showStep(k, target){
  step = Math.max(0, Math.min(SPEC.pages.length, k));
  document.body.classList.toggle('intro', step === 0);
  $$('.page').forEach(pg => pg.classList.toggle('on', +pg.dataset.step === step));
  $$('#nav a').forEach(a => a.classList.toggle('cur', +a.dataset.step === step));
  $$('.pmsg').forEach(m => m.classList.remove('on'));
  const cur = document.querySelector(`#nav a[data-step="${step}"]`); if (cur) cur.scrollIntoView({block:'nearest', inline:'center'});
  if (target) target.scrollIntoView({block:'center'}); else window.scrollTo(0, 0);
  try { localStorage.setItem(DRAFT_KEY + ':step', String(step)); } catch(e){}
}
function missing(k){
  const out = [];
  FIELDS.forEach(f => {
    if (!f.required || !isShown(f) || (k && pageOf(f) !== k) || answered(f)) return;
    const h = hostEl(f); if (h){ h.classList.add('missing'); out.push(h); }
  });
  return out;
}
function goTo(k){
  if (k > step && step >= 1){
    const miss = missing(step); const pg = document.querySelector(`.page[data-step="${step}"]`); const m = pg.querySelector('.pmsg');
    if (miss.length){
      m.textContent = `이 화면에 아직 답하지 않은 필수 문항이 ${miss.length}개 있습니다. 붉게 표시된 문항을 확인해 주십시오.`;
      m.classList.add('on'); miss[0].scrollIntoView({behavior:'smooth', block:'center'}); return;
    }
    if (pg.querySelector('[data-rank]') && rankDup()){ m.textContent = '순위에 같은 활동이 두 번 들어 있습니다.'; m.classList.add('on'); return; }
  }
  showStep(k);
}

/* ---------------- 제출 ---------------- */
function submit(){
  const eb = $('#errBox'); const miss = missing(0);
  if (miss.length){
    eb.innerHTML = `답하지 않은 필수 문항이 <b>${miss.length}개</b> 있습니다. <a href="#" id="goMiss">첫 번째 문항으로 이동 →</a>`;
    eb.classList.add('on');
    $('#goMiss').onclick = e => { e.preventDefault(); const h = miss[0]; showStep(+h.closest('.page').dataset.step, h); };
    return;
  }
  if (rankDup()){ eb.textContent = '순위에 같은 활동이 두 번 들어 있습니다.'; eb.classList.add('on'); return; }
  eb.classList.remove('on');
  const btn = $('#submitBtn'); btn.disabled = true; btn.textContent = '제출 중…';
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  const payload = {
    form: SPEC.form, version: SPEC.version, responseId: id,
    headers: ['응답ID','설문판','소요시간(분)'].concat(FIELDS.map(f => f.col)),
    values: [id, SPEC.version, Math.round((Date.now() - startedAt) / 60000)].concat(FIELDS.map(val))
  };
  const ok = () => {
    submitted = true; clearTimeout(saveTimer);
    try { localStorage.removeItem(DRAFT_KEY); localStorage.removeItem(DRAFT_KEY + ':step'); localStorage.setItem(DRAFT_KEY + ':done', id); } catch(e){}
    showDone(id);
  };
  const fail = err => {
    btn.disabled = false; btn.textContent = '응답 제출하기';
    eb.innerHTML = '제출 중 오류가 발생했습니다. 작성하신 내용은 이 브라우저에 임시저장되어 있으니 잠시 뒤 다시 눌러 주십시오.<br><small>' + esc(String(err && err.message || err)) + '</small>';
    eb.classList.add('on');
  };
  if (window.__TEST_SUBMIT__) { window.__TEST_SUBMIT__(payload).then(ok, fail); return; }
  if (window.google && google.script && google.script.run){
    google.script.run
      .withSuccessHandler(r => r && r.ok ? ok() : fail(r && r.error))
      .withFailureHandler(fail)
      .submit(payload);
    return;
  }
  if (!CFG.SCRIPT_URL) { fail('시험용 화면이라 응답을 저장하지 않습니다.'); return; }
  // GitHub판: 구글 로그인 정보를 싣지 않고 보낸다(계정이 여러 개 로그인된 기기에서도 저장되게)
  fetch(CFG.SCRIPT_URL, {method:'POST', credentials:'omit', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
    .then(r => r.json()).then(r => r && r.ok ? ok() : fail(r && r.error)).catch(fail);
}
function showDone(id){
  $('#app').style.display = 'none'; $('#done').style.display = 'block';
  $('#doneId').textContent = id ? '응답 번호: ' + String(id).slice(0, 8) : '';
  window.scrollTo(0, 0);
}

/* ---------------- 시작 ---------------- */
if (CFG.CLOSED){ $('#app').style.display = 'none'; $('#closed').style.display = 'block'; return; }
build();
let doneId = null; try { doneId = localStorage.getItem(DRAFT_KEY + ':done'); } catch(e){}
$('#againBtn').addEventListener('click', e => { e.preventDefault(); try { localStorage.removeItem(DRAFT_KEY + ':done'); } catch(err){} if (CFG.SELF_URL) window.open(CFG.SELF_URL, '_top'); else location.reload(); });
if (doneId){ showDone(doneId); return; }
loadDraft(); refreshUI();
const form = $('#form');
form.addEventListener('change', e => { if (e.target.type === 'checkbox') onMultiChange(e.target); refreshUI(); saveDraft(); });
form.addEventListener('input', () => { refreshUI(); saveDraft(); });
form.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) goTo(+b.dataset.go); });
$('#submitBtn').addEventListener('click', submit);
$('#startBtn').addEventListener('click', () => showStep(1));
$('#nav').addEventListener('click', e => { const a = e.target.closest('a[data-step]'); if (!a) return; e.preventDefault(); showStep(+a.dataset.step); });
let k0 = 0; try { k0 = +(localStorage.getItem(DRAFT_KEY + ':step') || 0); } catch(e){}
showStep(k0 || 0);
})();
</script>
</body>
</html>
